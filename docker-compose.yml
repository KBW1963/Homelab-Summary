# ───────────────────────────────────────────────────────────────
# Homelab Summary – Docker Compose Template
# ───────────────────────────────────────────────────────────────
# This is a template for running the aggregator.
# Copy to `docker-compose.yml` and fill in the placeholders.
# Keep the real `.env` file separate (do not commit it).
# ───────────────────────────────────────────────────────────────

services:
  aggregator:
    image: your-dockerhub-username/homelab-summary:latest
    container_name: homelab-summary
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      # ─── Aggregator ───
      - PORT=3333
      - POLL_INTERVAL_MS=30000
      - LOG_LEVEL=info
      - API_KEY=your-super-secret-aggregator-api-key

      # ─── Application URLs ───
      # Use either public domain or Tailscale IPs
      - PLEX_URL=https://plex.yourdomain.com/identity
      - JELLYFIN_URL=https://jellyfin.yourdomain.com/health
      - SONARR_URL=https://sonarr.yourdomain.com/api/v3/health
      - RADARR_URL=https://radarr.yourdomain.com/api/v3/health
      - PROWLARR_URL=https://prowlarr.yourdomain.com/api/v1/health
      - SEERR_URL=https://seerr.yourdomain.com/api/v1/status
      - SABNZBD_URL=https://sabnzbd.yourdomain.com/api

      # ─── Application Tokens ───
      - PLEX_TOKEN=your-plex-token
      - JELLYFIN_TOKEN=your-jellyfin-token
      - SONARR_API_KEY=your-sonarr-api-key
      - RADARR_API_KEY=your-radarr-api-key
      - PROWLARR_API_KEY=your-prowlarr-api-key
      - SEERR_API_KEY=your-seerr-api-key
      - SABNZBD_API_KEY=your-sabnzbd-api-key

      # ─── Infrastructure ───
      - TRUENAS_HOST=http://your-truenas-tailscale-ip
      - TRUENAS_API_KEY=your-truenas-api-key
      - PROXMOX_HOST=https://your-proxmox-tailscale-ip:8006
      - PROXMOX_API_TOKEN=PVEAPIToken=your-proxmox-token

      # ─── Network ───
      - NETWORK_PING_TARGETS=gateway|your-gateway-ip,dns|1.1.1.1,internet|8.8.8.8
      - NETWORK_DNS_TARGETS=google.com,github.com
      - NETWORK_DNS_SERVER=1.1.1.1,8.8.8.8
      - REDACT_IPS=true

      # ─── Tailscale (optional) ───
      - TAILSCALE_PATH=tailscale
      - TAILSCALE_API_KEY=tskey-api-your-tailscale-key
      - TAILSCALE_TAILNET=your-tailnet-name.ts.net

    # Optional: mount Tailscale socket if using the local CLI
    # volumes:
    #   - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock

# ─── Optional: custom network ───
# networks:
#   default:
#     name: homelab-net
#     external: true
